# Experiment Configuration: MountainCar-v0 & Pendulum-v1
# Baseline (H=0) vs. ACRPN (H) with Norm=True / Norm=False

# Global Settings
settings:
  batch_size: 128
  alpha: 10000.0
  num_updates: 500
  discount_factor: 0.999
  max_timesteps: 500
  hidden_sizes: [64, 256, 512, 512, 256, 64]
  activation: "relu"
  seeds: [1]

# Environments to benchmark
environments:
  - id: "Pendulum-v1"
    max_timesteps: 500
    solved_threshold: -500.0

# Algorithms to compare
algorithms:
  - "baseline"
  - "acrpn"

# Return normalization options
normalize_returns:
  - true

# Output settings
output:
  plot_file: "pendulum_deep_6layer_long_benchmark.png"
  data_file: "pendulum_deep_6layer_long_results.npz"
  title: "Pendulum-v1 (T=500, gamma=0.999, alpha=10000) | 6-Layer MLP | Baseline vs ACRPN"
