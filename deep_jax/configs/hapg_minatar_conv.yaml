# Experiment Configuration: All 4 MinAtar Environments with ConvNet Policy
# HAPG (Predictive Second-Order) vs. HAPG Baseline (H=0) | Normalized Updates (eta = 0.02)

# Global Settings
settings:
  batch_size: 128
  lr: 0.02
  num_updates: 500
  discount_factor: 0.99
  policy_type: "conv"
  activation: "relu"
  seeds: [1]

# Environments to benchmark (All 4 MinAtar games)
environments:
  - id: "Breakout-MinAtar"
    max_timesteps: 500
  - id: "SpaceInvaders-MinAtar"
    max_timesteps: 500
  - id: "Asterix-MinAtar"
    max_timesteps: 500
  - id: "Freeway-MinAtar"
    max_timesteps: 500

# Algorithms to compare
algorithms:
  - "hapg"
  - "hapg_baseline"

# Return normalization options
normalize_returns:
  - true
  - false

# Output settings
output:
  plot_file: "hapg_minatar_conv_benchmark.png"
  data_file: "hapg_minatar_conv_results.npz"
  title: "All MinAtar Environments | ConvNet | HAPG vs Baseline (H=0) (B=128, LR=0.02)"
