# Experiment Configuration: Breakout-MinAtar with One-Hotted Flattened MLP
# Baseline (H=0) vs. ACRPN (H) with Norm=True vs. Norm=False

# Global Settings
settings:
  batch_size: 128
  alpha: 5000.0
  num_updates: 500
  discount_factor: 0.99
  policy_type: "mlp"
  hidden_sizes: [128, 128]
  activation: "relu"
  seeds: [1]

# Environments to benchmark
environments:
  - id: "Breakout-MinAtar"
    max_timesteps: 500

# Algorithms to compare
algorithms:
  - "baseline"
  - "acrpn"

# Return normalization options
normalize_returns:
  - true
  - false

# Output settings
output:
  plot_file: "minatar_breakout_mlp_benchmark.png"
  data_file: "minatar_breakout_mlp_results.npz"
  title: "Breakout-MinAtar | Flattened MLP (128, 128) | Batch=128, Alpha=5000"
