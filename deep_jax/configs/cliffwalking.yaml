# Experiment Configuration: CliffWalking 4x6 (GridWorld)
# Comparing ACRPN (Curvature H), ACRPN + Momentum, and Baseline (H=0) with Linear Policy

# Global Settings
settings:
  batch_size: 128
  alpha: 1000.0
  krylov_dim: 5
  lr: 0.05
  num_updates: 100
  discount_factor: 1.0
  hidden_sizes: []               # Linear tabular softmax policy (24 x 4 = 96 parameters)
  activation: "relu"
  seeds: [1]
  use_std: true
  c_goal_dist: 0.1

# Environment settings
environments:
  - id: "CliffWalking4x6-v0"
    max_timesteps: 250
    solved_threshold: -10.0

# Algorithms to benchmark
algorithms:
  - "krylov_crpn"
  - "acrpn"
  - "baseline"

# Return normalization
normalize_returns:
  - true

# Output settings
output:
  plot_file: "cliffwalking_benchmark.png"
  data_file: "cliffwalking_results.npz"
  title: "CliffWalking 4x6 Benchmark (Alpha=1000, k=5, With Std, No Momentum) | Krylov-CRPN vs. ACRPN vs. Baseline"
